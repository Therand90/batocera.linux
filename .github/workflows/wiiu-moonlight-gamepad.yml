name: Build Moonlight WiiU GamePad

on:
  push:
    branches:
      - wiiu-moonlight-gamepad
    paths:
      - .github/workflows/wiiu-moonlight-gamepad.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone Moonlight Android
        run: |
          git clone --depth 1 --recursive https://github.com/moonlight-stream/moonlight-android.git moonlight
          cd moonlight
          git rev-parse HEAD | tee ../MOONLIGHT_UPSTREAM_COMMIT.txt

      - name: Install required Android SDK components
        run: |
          SDKROOT="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"

          # compileSdk 37 is resolved by AGP as android-37, while Google's
          # current SDK package is installed as android-37.0.
          # Provide the compatibility alias expected by AGP.
          if [ -d "$SDKROOT/platforms/android-37.0" ] && [ ! -e "$SDKROOT/platforms/android-37" ]; then
            ln -s "$SDKROOT/platforms/android-37.0" "$SDKROOT/platforms/android-37"
          fi

          echo "===== Android platforms ====="
          ls -ld "$SDKROOT/platforms/android-37" "$SDKROOT/platforms/android-37.0"

      - name: Patch Moonlight for Wii U GamePad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("moonlight")

          # 1) Dedicated package/app name so it installs beside official Moonlight.
          p = root / "app/build.gradle"
          s = p.read_text()

          s, count = re.subn(
              r'(nonRoot\s*\{.*?applicationId\s+)"com\.limelight"',
              r'\1"com.therand.wiiugamepad"',
              s,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("nonRoot applicationId patch failed")

          s, count = re.subn(
              r'resValue\s+"string",\s*"app_label",\s*"Moonlight \(Debug\)"',
              'resValue "string", "app_label", "Moonlight WiiU"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("debug app label patch failed")

          p.write_text(s)

          # 2) Sensible defaults for this dedicated GamePad client.
          p = root / "app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java"
          s = p.read_text()

          old = "private static final boolean DEFAULT_HOST_AUDIO = false;"
          if old not in s:
              raise SystemExit("DEFAULT_HOST_AUDIO not found")
          s = s.replace(old, "private static final boolean DEFAULT_HOST_AUDIO = true;", 1)

          old = "private static final boolean DEFAULT_TOUCHSCREEN_TRACKPAD = true;"
          if old not in s:
              raise SystemExit("DEFAULT_TOUCHSCREEN_TRACKPAD not found")
          s = s.replace(old, "private static final boolean DEFAULT_TOUCHSCREEN_TRACKPAD = false;", 1)

          p.write_text(s)

          # 3) Make absolute finger input act like a real touchscreen:
          # DOWN immediately, MOVE while held, UP immediately.
          p = root / "app/src/main/java/com/limelight/binding/input/touch/AbsoluteTouchContext.java"
          s = p.read_text()

          pattern = re.compile(
              r'if \(actionIndex == 0\) \{\s*'
              r'// Start the timers\s*'
              r'startTapDownTimer\(\);\s*'
              r'startLongPressTimer\(\);\s*'
              r'\}',
              re.S,
          )

          replacement = '''if (actionIndex == 0) {
              // Wii U GamePad mode: direct touch semantics.
              updatePosition(eventX, eventY);
              confirmedTap = true;
              conn.sendMouseButtonDown(MouseButtonPacket.BUTTON_LEFT);
          }'''

          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit("AbsoluteTouchContext touch-down patch failed")

          p.write_text(s)

          # 4) Add a safe bezel around the stream so Wii U edge gestures start
          # away from Android's notification/home/back gesture zones.
          p = root / "app/src/main/res/layout/activity_game.xml"
          s = p.read_text()

          marker = '        android:layout_gravity="center"\n        android:focusable="true"'
          replacement = '''        android:layout_gravity="center"
              android:layout_marginStart="16dp"
              android:layout_marginEnd="16dp"
              android:layout_marginTop="24dp"
              android:layout_marginBottom="24dp"
              android:focusable="true"'''

          if marker not in s:
              raise SystemExit("StreamView insertion point not found")
          s = s.replace(marker, replacement, 1)

          bg_marker = '        android:layout_height="match_parent"\n        android:layout_gravity="center" />'
          bg_replacement = '''        android:layout_height="match_parent"
              android:layout_gravity="center"
              android:background="#000000" />'''

          if bg_marker not in s:
              raise SystemExit("backgroundTouchView insertion point not found")
          s = s.replace(bg_marker, bg_replacement, 1)

          p.write_text(s)

          print("Moonlight WiiU patches applied successfully")
          PY

      - name: Show patch diff
        working-directory: moonlight
        run: git diff -- app/build.gradle app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java app/src/main/java/com/limelight/binding/input/touch/AbsoluteTouchContext.java app/src/main/res/layout/activity_game.xml

      - name: Build signed debug APK
        working-directory: moonlight
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          APK="$(find moonlight/app/build/outputs/apk -type f -name '*nonRoot*debug*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" out/Moonlight-WiiU-GamePad.apk
          cp MOONLIGHT_UPSTREAM_COMMIT.txt out/
          sha256sum out/Moonlight-WiiU-GamePad.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-WiiU-GamePad
          path: out/
          if-no-files-found: error
