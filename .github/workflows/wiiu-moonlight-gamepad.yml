name: Build Moonlight WiiU GamePad

on:
  push:
    branches:
      - wiiu-moonlight-gamepad
    paths:
      - .github/workflows/wiiu-moonlight-gamepad.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone Moonlight Android
        run: |
          git clone --depth 1 --recursive https://github.com/moonlight-stream/moonlight-android.git moonlight
          cd moonlight
          git rev-parse HEAD | tee ../MOONLIGHT_UPSTREAM_COMMIT.txt

      - name: Install required Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"

      - name: Patch Moonlight for Wii U GamePad
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("moonlight")

          # 1) Dedicated package/app name so it installs beside official Moonlight.
          p = root / "app/build.gradle"
          s = p.read_text()

          old = '''        nonRoot {
              externalNativeBuild {'''
          if old not in s:
              raise SystemExit("nonRoot flavor not found")

          # Only the nonRoot applicationId is replaced.
          target = '            applicationId "com.limelight"'
          if target not in s:
              raise SystemExit("nonRoot applicationId not found")
          s = s.replace(target, '            applicationId "com.therand.wiiugamepad"', 1)

          s = s.replace(
              'resValue "string", "app_label", "Moonlight (Debug)"',
              'resValue "string", "app_label", "Moonlight WiiU"',
              1,
          )
          p.write_text(s)

          # 2) Sensible defaults for this dedicated GamePad client.
          p = root / "app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java"
          s = p.read_text()
          s = s.replace(
              "private static final boolean DEFAULT_HOST_AUDIO = false;",
              "private static final boolean DEFAULT_HOST_AUDIO = true;",
              1,
          )
          s = s.replace(
              "private static final boolean DEFAULT_TOUCHSCREEN_TRACKPAD = true;",
              "private static final boolean DEFAULT_TOUCHSCREEN_TRACKPAD = false;",
              1,
          )
          p.write_text(s)

          # 3) Make absolute finger input act like a real touchscreen:
          # DOWN immediately, MOVE while held, UP immediately.
          p = root / "app/src/main/java/com/limelight/binding/input/touch/AbsoluteTouchContext.java"
          s = p.read_text()

          old = '''        if (actionIndex == 0) {
              // Start the timers
              startTapDownTimer();
              startLongPressTimer();
          }'''

          new = '''        if (actionIndex == 0) {
              // Wii U GamePad mode: treat a finger like direct resistive touch.
              // Press immediately and keep the left button held during movement.
              updatePosition(eventX, eventY);
              confirmedTap = true;
              conn.sendMouseButtonDown(MouseButtonPacket.BUTTON_LEFT);
          }'''

          if old not in s:
              raise SystemExit("AbsoluteTouchContext touch-down block not found")

          s = s.replace(old, new, 1)
          p.write_text(s)

          # 4) Add a small visible "GamePad bezel" around the video.
          # This moves the virtual top/bottom/side edges away from Android's
          # notification/home/back gesture zones. Touch coordinates remain
          # relative to the StreamView, so the inner image edge is Wii U x/y=0/max.
          p = root / "app/src/main/res/layout/activity_game.xml"
          s = p.read_text()

          old = '''    <com.limelight.ui.StreamView
              android:id="@+id/surfaceView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:layout_gravity="center"'''

          new = '''    <com.limelight.ui.StreamView
              android:id="@+id/surfaceView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:layout_gravity="center"
              android:layout_marginStart="16dp"
              android:layout_marginEnd="16dp"
              android:layout_marginTop="24dp"
              android:layout_marginBottom="24dp"'''

          if old not in s:
              raise SystemExit("StreamView layout block not found")

          s = s.replace(old, new, 1)

          # Make the safe bezel explicitly black.
          bg = '''    <View
              android:id="@+id/backgroundTouchView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:layout_gravity="center" />'''
          bg_new = '''    <View
              android:id="@+id/backgroundTouchView"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:layout_gravity="center"
              android:background="#000000" />'''
          if bg not in s:
              raise SystemExit("backgroundTouchView block not found")
          s = s.replace(bg, bg_new, 1)

          p.write_text(s)

          print("Moonlight WiiU patches applied successfully")
          PY

      - name: Show patch diff
        working-directory: moonlight
        run: git diff -- app/build.gradle app/src/main/java/com/limelight/preferences/PreferenceConfiguration.java app/src/main/java/com/limelight/binding/input/touch/AbsoluteTouchContext.java app/src/main/res/layout/activity_game.xml

      - name: Build signed debug APK
        working-directory: moonlight
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p out
          APK="$(find moonlight/app/build/outputs/apk -type f -name '*nonRoot*debug*.apk' | head -n1)"
          test -n "$APK"
          cp "$APK" out/Moonlight-WiiU-GamePad.apk
          cp MOONLIGHT_UPSTREAM_COMMIT.txt out/
          sha256sum out/Moonlight-WiiU-GamePad.apk | tee out/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-WiiU-GamePad
          path: out/
          if-no-files-found: error
